[project]
name = "grounded-alpha"
version = "0.2.0"
description = "Evidence-gated evaluation harness for financial research agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Apurva Patel" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial",
]
dependencies = []

[project.scripts]
grounded-alpha = "grounded_alpha.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["ruff>=0.12.0"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.uv]
required-version = ">=0.8.0"
